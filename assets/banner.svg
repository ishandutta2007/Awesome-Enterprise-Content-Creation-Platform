<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="50" result="blur" />
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1) translate(0, 0); }
        50% { opacity: 0.65; transform: scale(1.15) translate(20px, -15px); }
      }
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-1deg); }
      }
      @keyframes shimmerBorder {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes waveFloat {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(-30px); }
      }

      .orb1 { animation: pulseGlow 8s ease-in-out infinite; transform-origin: 200px 100px; }
      .orb2 { animation: pulseGlow 10s ease-in-out infinite 3s; transform-origin: 1000px 250px; }
      .card-float-1 { animation: floatCard1 6s ease-in-out infinite; }
      .card-float-2 { animation: floatCard2 7s ease-in-out infinite 1s; }
      .wave-anim { animation: waveFloat 12s ease-in-out infinite alternate; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Glowing Ambient Orbs (Background layer) -->
  <g filter="url(#softGlow)">
    <circle class="orb1" cx="220" cy="110" r="160" fill="#3b82f6" opacity="0.3" />
    <circle class="orb2" cx="980" cy="240" r="170" fill="#a855f7" opacity="0.25" />
    <circle class="orb1" cx="600" cy="280" r="120" fill="#ec4899" opacity="0.15" />
  </g>

  <!-- Modern Tech Grid Lines (Subtle) -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Flowing Dynamic Waves (Background) -->
  <path class="wave-anim" d="M -50 280 Q 250 230 550 290 T 1150 260 T 1350 300" fill="none" stroke="url(#primaryTextGrad)" stroke-width="2" stroke-opacity="0.35" />
  <path class="wave-anim" d="M -50 310 Q 300 270 650 320 T 1250 290 T 1400 320" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Left Dynamic Decorative Pill Card (Background/Side) -->
  <g class="card-float-1" transform="translate(60, 65)">
    <rect width="180" height="70" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="28" cy="35" r="14" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M23 35 L27 39 L34 31" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="52" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Digital Assets</text>
    <text x="52" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8">Governance &amp; DAM</text>
  </g>

  <!-- Right Dynamic Decorative Pill Card (Background/Side) -->
  <g class="card-float-2" transform="translate(960, 65)">
    <rect width="180" height="70" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="28" cy="35" r="14" fill="#7e22ce" fill-opacity="0.3" stroke="#c084fc" stroke-width="1.5" />
    <path d="M24 35 L32 35 M28 31 L32 35 L28 39" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="52" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Design Automation</text>
    <text x="52" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8">Creative APIs &amp; AI</text>
  </g>

  <!-- Top Category Chip / Pill -->
  <g transform="translate(470, 48)">
    <rect width="260" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="20" cy="15" r="5" fill="#22c55e" />
    <text x="35" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" letter-spacing="1">CURATED ENTERPRISE ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND: Main Title and Subtitle (Guaranteed in foreground, crystal clear) -->
  <!-- Subtle dark backing behind text to guarantee complete legibility -->
  <rect x="230" y="98" width="740" height="152" rx="16" fill="#0b0f19" fill-opacity="0.75" />

  <!-- Main Headline -->
  <text x="600" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#primaryTextGrad)" letter-spacing="-0.5">
    Enterprise Content Creation
  </text>
  <text x="600" y="194" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f8fafc" letter-spacing="-0.2">
    Platform Ecosystem
  </text>

  <!-- Subtitle -->
  <text x="600" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    🎨 Branded Content Generation &bull; ⚡ Design Automation &bull; 🗄️ Digital Asset Management (DAM)
  </text>

  <!-- Bottom Interactive Tags Pill Bar -->
  <g transform="translate(340, 275)">
    <rect x="0" y="0" width="125" height="26" rx="13" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
    <text x="62.5" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">SaaS Leaders</text>

    <rect x="135" y="0" width="125" height="26" rx="13" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
    <text x="197.5" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#a855f7">Open Source</text>

    <rect x="270" y="0" width="125" height="26" rx="13" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
    <text x="332.5" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ec4899">Brand Control</text>

    <rect x="405" y="0" width="115" height="26" rx="13" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
    <text x="462.5" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#4ade80">Template APIs</text>
  </g>

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="2" />
</svg>
