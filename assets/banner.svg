<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Vibrant Heading Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Subtle Tech Grid -->
    <pattern id="creativeGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.25" />
      <circle cx="0" cy="0" r="1.2" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <!-- Dynamic CSS Keyframe Animations -->
    <style>
      <![CDATA[
      @keyframes pulseLight {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.15); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }
      @keyframes scanMotion {
        0% { transform: translateY(0px); opacity: 0.15; }
        50% { opacity: 0.8; }
        100% { transform: translateY(280px); opacity: 0.15; }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes beaconWave {
        0% { r: 6px; opacity: 0.9; stroke-width: 2px; }
        100% { r: 36px; opacity: 0; stroke-width: 0.5px; }
      }

      .pulse-orb1 { animation: pulseLight 7s ease-in-out infinite; transform-origin: 180px 90px; }
      .pulse-orb2 { animation: pulseLight 9s ease-in-out infinite 2s; transform-origin: 820px 190px; }
      .scan-beam { animation: scanMotion 6s linear infinite; }
      .dash-flow { stroke-dasharray: 8, 8; animation: dashMove 10s linear infinite; }
      .float-card-l { animation: floatSlow1 5s ease-in-out infinite; }
      .float-card-r { animation: floatSlow2 6s ease-in-out infinite 1s; }
      .beacon-ring { animation: beaconWave 3s cubic-bezier(0.1, 0.8, 0.3, 1) infinite; }

      .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; }
      ]]>
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="280" fill="url(#bgGrad)" rx="16" />
  <rect width="1000" height="280" fill="url(#creativeGrid)" rx="16" />

  <!-- Animated Glowing Atmospheric Orbs (Background) -->
  <g filter="url(#glowBlur)">
    <circle class="pulse-orb1" cx="180" cy="90" r="140" fill="#0284c7" opacity="0.4" />
    <circle class="pulse-orb2" cx="820" cy="190" r="150" fill="#9333ea" opacity="0.35" />
    <circle cx="500" cy="140" r="120" fill="#db2777" opacity="0.12" />
  </g>

  <!-- Animated Scanning Beam (Background layer) -->
  <rect class="scan-beam" x="0" y="0" width="1000" height="2" fill="url(#scanGrad)" opacity="0.6" />

  <!-- Animated Flow Lines (Connecting Hubs) -->
  <path class="dash-flow" d="M 120 70 L 260 70 L 300 120 L 400 120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35" />
  <path class="dash-flow" d="M 880 210 L 740 210 L 700 160 L 600 160" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.35" />
  <path class="dash-flow" d="M 160 220 L 280 220 L 320 180" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Left Creative Beacon / Node Hub -->
  <g transform="translate(60, 50)">
    <circle cx="30" cy="30" r="28" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4,4" />
    <circle cx="30" cy="30" r="18" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3" />
    <circle class="beacon-ring" cx="30" cy="30" r="6" fill="none" stroke="#38bdf8" />
    <circle cx="30" cy="30" r="5" fill="#38bdf8" />
  </g>

  <!-- Left Dynamic Floating Pill Card (Background/Side) -->
  <g class="float-card-l" transform="translate(45, 135)" filter="url(#softShadow)">
    <rect width="180" height="66" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <rect x="14" y="16" width="34" height="34" rx="8" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
    <!-- Folder / DAM icon inside small box -->
    <path d="M 23 28 L 28 28 L 30 31 L 39 31 L 39 40 L 23 40 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round" />
    <text x="58" y="32" class="font-title" font-size="12" fill="#f8fafc">Digital Assets</text>
    <text x="58" y="47" class="font-sub" font-size="10" fill="#94a3b8">Enterprise DAM</text>
  </g>

  <!-- Right Dynamic Floating Pill Card (Background/Side) -->
  <g class="float-card-r" transform="translate(775, 75)" filter="url(#softShadow)">
    <rect width="180" height="66" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1" />
    <rect x="14" y="16" width="34" height="34" rx="8" fill="#7e22ce" fill-opacity="0.25" stroke="#c084fc" stroke-width="1" />
    <!-- Wand / Automation icon inside small box -->
    <path d="M 26 39 L 36 29 M 33 26 L 37 30 M 25 25 L 27 25 M 37 39 L 39 39" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" />
    <text x="58" y="32" class="font-title" font-size="12" fill="#f8fafc">Automation APIs</text>
    <text x="58" y="47" class="font-sub" font-size="10" fill="#94a3b8">Creative Engines</text>
  </g>

  <!-- Right Beacon Hub -->
  <g transform="translate(880, 180)">
    <circle cx="30" cy="30" r="28" fill="none" stroke="#c084fc" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4,4" />
    <circle cx="30" cy="30" r="18" fill="none" stroke="#ec4899" stroke-width="1" stroke-opacity="0.3" />
    <circle class="beacon-ring" cx="30" cy="30" r="6" fill="none" stroke="#c084fc" />
    <circle cx="30" cy="30" r="5" fill="#c084fc" />
  </g>

  <!-- FOREGROUND: Central Card Backdrop (Guarantees Title & Subtitle 100% Foreground Legibility) -->
  <g transform="translate(210, 30)" filter="url(#softShadow)">
    <!-- High-contrast frosted glass container -->
    <rect width="580" height="218" rx="16" fill="#090d16" fill-opacity="0.88" stroke="#334155" stroke-width="1" />

    <!-- Top Badge Pill -->
    <g transform="translate(170, 18)">
      <rect width="240" height="26" rx="13" fill="#1e293b" fill-opacity="0.9" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1" />
      <circle cx="16" cy="13" r="4.5" fill="#22c55e" />
      <text x="28" y="17" class="font-mono" font-size="9.5" fill="#cbd5e1" letter-spacing="1">CURATED ENTERPRISE STACK</text>
    </g>

    <!-- Main Headline Line 1 -->
    <text x="290" y="85" text-anchor="middle" class="font-title" font-size="30" fill="url(#titleGrad)" letter-spacing="-0.5">
      Enterprise Content Creation
    </text>

    <!-- Main Headline Line 2 -->
    <text x="290" y="120" text-anchor="middle" class="font-title" font-size="24" fill="#f8fafc" letter-spacing="-0.2">
      Platform Ecosystem
    </text>

    <!-- Subtitle Line -->
    <text x="290" y="152" text-anchor="middle" class="font-sub" font-size="12.5" fill="#94a3b8" letter-spacing="0.3">
      Branded Content Generation &#8226; Design Automation &#8226; Digital Asset Management
    </text>

    <!-- Bottom Feature Tags -->
    <g transform="translate(50, 172)">
      <rect x="0" y="0" width="105" height="24" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="52.5" y="16" text-anchor="middle" class="font-title" font-size="10" fill="#38bdf8">SaaS Leaders</text>

      <rect x="115" y="0" width="115" height="24" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="172.5" y="16" text-anchor="middle" class="font-title" font-size="10" fill="#a5b4fc">Open Source</text>

      <rect x="240" y="0" width="115" height="24" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1" />
      <text x="297.5" y="16" text-anchor="middle" class="font-title" font-size="10" fill="#d8b4fe">Brand Control</text>

      <rect x="365" y="0" width="115" height="24" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1" />
      <text x="422.5" y="16" text-anchor="middle" class="font-title" font-size="10" fill="#f472b6">Creative APIs</text>
    </g>
  </g>

  <!-- Outer Frame Border -->
  <rect x="1" y="1" width="998" height="278" rx="15" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5" />
</svg>
